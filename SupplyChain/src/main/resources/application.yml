server:
  port: 8091

spring:
  application:
    name: supply-chain

  # ── MySQL 8.0 + Druid ────────────────────────────────────────────
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/sc_supply_chain?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 30000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      remove-abandoned: true
      remove-abandoned-timeout: 180
      log-abandoned: true
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000
      filters: stat,wall,slf4j
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USER:admin}
        login-password: ${DRUID_PASS:admin123}
        allow: 127.0.0.1
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.css,/druid/*"

  # ── Redis ────────────────────────────────────────────────────────
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 1
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

  # ── Kafka ────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      acks: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: supply-chain
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true
    listener:
      concurrency: 3
      ack-mode: manual

  # ── Async / Scheduling ──────────────────────────────────────────
  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 200
        keep-alive: 60s
      thread-name-prefix: sc-async-
    scheduling:
      pool:
        size: 5
      thread-name-prefix: sc-scheduled-

  # ── SpringDoc does NOT need pathmatch override (unlike Springfox) ──

# ── MyBatis-Plus ─────────────────────────────────────────────────────
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sc.supplychain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: false
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# ── Logging ───────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.sc.supplychain: DEBUG           # 业务代码全量 DEBUG
    org.springframework.kafka: WARN
    org.springframework: INFO
  file:
    name: app.log                       # 项目根目录 / 容器内 /app/app.log
    max-size: 50MB
    max-history: 7
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7

# Knife4j UI:   http://localhost:8091/doc.html
# Swagger UI:   http://localhost:8091/swagger-ui/index.html
# API JSON:     http://localhost:8091/v3/api-docs
knife4j:
  enable: true                          # 开启 Knife4j 增强模式
  setting:
    language: zh_cn                     # 界面语言：中文
    enable-swagger-models: true         # 显示 Models 列表
    enable-document-manage: true        # 显示文档管理菜单
    swagger-model-name: 数据模型
  production: false                     # false = 开发模式，可访问 doc.html
  basic:
    enable: false                       # true = 开启密码保护（生产建议开启）
    username: admin
    password: admin123

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ── Supply Chain custom properties ────────────────────────────────────
supply-chain:
  expiry:
    warn-days-near: 7        # days left <= 7  -> NEAR_EXPIRY
    warn-days-urgent: 3      # days left <= 3  -> URGENT
  reconcile:
    diff-threshold: 5        # |Redis - DB| > 5 triggers fix
  kingdee:
    enabled: false
    base-url: ${KINGDEE_URL:http://kingdee-api:8080}
    app-id: ${KINGDEE_APP_ID:}
    app-secret: ${KINGDEE_APP_SECRET:}
    timeout: 10000
