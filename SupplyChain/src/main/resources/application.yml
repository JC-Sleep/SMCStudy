server:
  port: 8091

spring:
  application:
    name: supply-chain

  # ── 数据源：MySQL 8.0 + Druid ──────────────────────────────────────
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/sc_supply_chain?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 30000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1                   # MySQL 心跳SQL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      remove-abandoned: true
      remove-abandoned-timeout: 180
      log-abandoned: true
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000
      filters: stat,wall,slf4j
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USER:admin}
        login-password: ${DRUID_PASS:admin123}
        allow: 127.0.0.1
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.css,/druid/*"

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 1          # 库存中台使用 DB1，避免与其他模块冲突
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

  # ── Kafka ───────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      acks: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: supply-chain
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      concurrency: 10
      ack-mode: manual

  # ── 异步任务线程池 ────────────────────────────────────────────────────
  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 200
        keep-alive: 60s
        thread-name-prefix: sc-async-
    scheduling:
      pool:
        size: 5
        thread-name-prefix: sc-scheduled-

# ── MyBatis-Plus ─────────────────────────────────────────────────────
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sc.supplychain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: false
  global-config:
    db-config:
      id-type: assign_id      # 雪花算法
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# ── 日志 ─────────────────────────────────────────────────────────────
logging:
  level:
    com.sc.supplychain: DEBUG
    org.springframework: INFO

# ── Swagger 兼容（Spring Boot 2.6.x 需要） ───────────────────────────
spring.mvc.pathmatch.matching-strategy: ant_path_matcher

# ── Knife4j ──────────────────────────────────────────────────────────
knife4j:
  enable: true
  setting:
    language: zh-CN

# ── 供应链业务配置 ────────────────────────────────────────────────────
supply-chain:
  # 生鲜效期预警天数（可按品类细化，后期升级为DB配置）
  expiry:
    warn-days-near: 7        # ≤7天：NEAR_EXPIRY（黄色预警）
    warn-days-urgent: 3      # ≤3天：URGENT（红色预警，人工处理）
  # 库存对账
  reconcile:
    diff-threshold: 5        # Redis与DB差值超过5则告警
  # 金蝶云（Phase2预留，当前不启用）
  kingdee:
    enabled: false
    base-url: ${KINGDEE_URL:http://kingdee-api:8080}
    app-id: ${KINGDEE_APP_ID:}
    app-secret: ${KINGDEE_APP_SECRET:}
    timeout: 10000

