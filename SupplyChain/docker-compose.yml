version: "3.9"

# ============================================================
# 旺生活 O2O 供应链中台 — 基础设施 Docker Compose
# 用法:
#   仅启动中间件:    docker-compose up -d mysql redis kafka kafka-ui
#   启动全部(含App): docker-compose --profile app up -d
# ============================================================

services:

  # ── MySQL 8.0 ─────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.33
    container_name: sc-mysql
    ports:
      - "3307:3306"   # Host 3307 → Container 3306 (avoids conflict with local MySQL on 3306)
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: sc_supply_chain
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=200
      - --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sc-net

  # ── Redis 7 ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sc-redis
    ports:
      - "6380:6379"   # Host 6380 → Container 6379 (avoids conflict with local Redis on 6379)
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - sc-net

  # ── Kafka 3.6 / Confluent Platform (KRaft — no ZooKeeper needed) ──
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sc-kafka
    ports:
      - "9092:9092"     # external (for Spring Boot app on HOST → localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # EXTERNAL  = host access (localhost:9092)
      # INTERNAL  = docker-network access (kafka:29092)
      # CONTROLLER= Raft internal
      KAFKA_LISTENERS: CONTROLLER://kafka:29093,INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - sc-net

  # ── Kafka UI (Web 界面查看 Topic/消息) ─────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sc-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: supply-chain
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092   # use internal listener
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sc-net

  # ── Spring Boot App ────────────────────────────────────────────
  # 启动前必须先执行: mvn clean package -DskipTests
  supply-chain-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sc-app
    ports:
      - "8091:8091"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      KAFKA_SERVERS: kafka:29092   # 容器内走内部网络
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped
    networks:
      - sc-net

volumes:
  mysql_data:
  redis_data:
  kafka_data:

networks:
  sc-net:
    driver: bridge





